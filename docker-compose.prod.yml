# Stack de prod : postgres + api + web (M7-T1), le tout derrière le reverse
# proxy existant du VPS (M7-T2, voir doc/DEPLOY.md) qui gère TLS et route
# vers les ports publiés ci-dessous. `web` sert le build statique de la PWA
# via l'image nginx autonome de `apps/web/Dockerfile` (choix M7-T2 : conteneur
# nginx plutôt que dist statique copié à la main sur l'hôte, pour rester
# buildable/déployable de la même façon que `api`).
#
# Les uploads (`UPLOADS_HOST_DIR`) sont en bind mount, pas en volume nommé :
# le reverse proxy (hors Docker, sur l'hôte) doit pouvoir servir ce même
# dossier directement sous /uploads sans passer par le conteneur `api`
# (cf. apps/api/.env.example UPLOADS_DIR et doc/DEPLOY.md).
#
# Usage : cp .env.example .env (à remplir), puis
#   docker compose -f docker-compose.prod.yml up --build -d
services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}']
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 3000
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?schema=public
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET}
      JWT_ACCESS_EXPIRES_IN: ${JWT_ACCESS_EXPIRES_IN:-15m}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET}
      JWT_REFRESH_EXPIRES_IN: ${JWT_REFRESH_EXPIRES_IN:-30d}
      UPLOADS_DIR: ./uploads
      CORS_ORIGINS: ${CORS_ORIGINS}
      VAPID_PUBLIC_KEY: ${VAPID_PUBLIC_KEY:-}
      VAPID_PRIVATE_KEY: ${VAPID_PRIVATE_KEY:-}
      VAPID_SUBJECT: ${VAPID_SUBJECT:-mailto:admin@example.com}
    ports:
      - '${API_PORT:-3000}:3000'
    volumes:
      - ${UPLOADS_HOST_DIR:-./data/uploads}:/app/apps/api/uploads

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        VITE_API_URL: ${VITE_API_URL}
        VITE_VAPID_PUBLIC_KEY: ${VAPID_PUBLIC_KEY:-}
    restart: unless-stopped
    ports:
      - '${WEB_PORT:-8080}:80'

volumes:
  postgres_data:
