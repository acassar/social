# Sert le build statique de la PWA (vue-router en mode history) : toute
# route inconnue du serveur retombe sur index.html plutôt qu'un 404 nginx,
# pour laisser vue-router résoudre la route côté client.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }
}
